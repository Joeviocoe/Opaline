name: Build IPA

# Every push to main builds the IPA and creates a DRAFT release with it
# attached. Publishing the draft (manually, after reviewing the notes) fires
# publish-source.yml, which updates source/apps.json — so the source never
# points at a download URL that isn't live yet.

on:
  push:
    branches: [main]
    paths-ignore:
      - "source/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags for version computation, full history for build number

      # The SwiftLint build phase runs --strict, so a newer linter on the image
      # can fail the build with rules the project has never seen; pin the
      # project's version. Xcode stays the image default: non-default Xcodes
      # on the runner have no iOS platform installed, and downloading it per
      # run costs gigabytes.
      - name: Pin SwiftLint 0.63.3
        run: |
          curl -sL -o "$RUNNER_TEMP/swiftlint.zip" \
            https://github.com/realm/SwiftLint/releases/download/0.63.3/portable_swiftlint.zip
          unzip -oq "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          sudo install -m 755 "$RUNNER_TEMP/swiftlint/swiftlint" "$(brew --prefix)/bin/swiftlint"
          swiftlint version

      # make_ipa.sh signs with ldid instead of codesign (issue #32). The runner
      # image ships homebrew-core's ldid, which has no -S flag.
      - name: Install ldid-procursus
        run: |
          brew unlink ldid 2>/dev/null || true
          brew install ldid-procursus
          ldid 2>&1 | head -1

      - name: Configure local build settings
        run: |
          cp Config/Local.xcconfig.example Config/Local.xcconfig
          # Point the update-notification check at this repository's own
          # feed, so a fork ships with its own without editing anything.
          # `//` starts a comment in xcconfig — hence the `$()` splits.
          sed -i '' '/^APP_MANIFEST_URL/d' Config/Local.xcconfig
          if [ "${GITHUB_REPOSITORY%%/*}" = "verback2308" ]; then
            # Upstream polls its own domain: the URL is baked into every
            # shipped binary and can never be changed afterwards, so it must
            # survive a repo rename or a move off GitHub. Matched on the owner,
            # not the full name, so it keeps holding after a rename.
            printf 'APP_MANIFEST_URL = https:/$()/repo.verback2308.pp.ua/apps.json\n' \
              >> Config/Local.xcconfig
          else
            printf 'APP_MANIFEST_URL = https:/$()/raw.githubusercontent.com/%s/main/source/apps.json\n' \
              "$GITHUB_REPOSITORY" >> Config/Local.xcconfig
          fi
          cat Config/Local.xcconfig

      - name: Compute release version
        id: version
        run: |
          git fetch --tags --force --quiet
          MARKETING=$(sed -n 's/.*MARKETING_VERSION = \([^;]*\);.*/\1/p' \
            Opaline.xcodeproj/project.pbxproj | head -1)
          MAJOR_MINOR=$(echo "$MARKETING" | cut -d. -f1,2)
          PATCH=$(echo "$MARKETING" | cut -d. -f3)
          PATCH=${PATCH:-0}
          VERSION="$MAJOR_MINOR.$PATCH"
          # MARKETING_VERSION is a floor: while its tag is already released,
          # bump the patch. Drafts don't create tags, so a pending draft is
          # simply replaced by the next build instead of burning a version.
          while git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; do
            PATCH=$((PATCH + 1))
            VERSION="$MAJOR_MINOR.$PATCH"
          done
          BUILD=$(git rev-list --count HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION, build $BUILD (project has $MARKETING)"

      - name: Build IPA
        env:
          IPA_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          UPDATE_SOURCE: "0"
          XCODEBUILD_EXTRA_ARGS: CODE_SIGNING_ALLOWED=NO
        run: ./make_ipa.sh

      - name: Build Cydia/Sileo debs
        run: ./make_deb.sh

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Replace a stale draft for the same version, if any
          # (published releases have tags, so they never match here).
          gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"$VERSION\") | .id" |
            while read -r id; do
              echo "Deleting stale draft release $id"
              gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
            done
          gh release create "$VERSION" \
            "Opaline_${VERSION}.ipa" \
            "com.verback.ytlite_${VERSION}_iphoneos-arm.deb" \
            "com.verback.ytlite_${VERSION}_iphoneos-arm64.deb" \
            --draft \
            --title "$VERSION" \
            --generate-notes \
            --target "$GITHUB_SHA"
          echo "Draft release $VERSION created — edit the notes and publish it"
